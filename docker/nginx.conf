# nginx перед Next.js: слушает 80, проксирует на app:3000.
# TLS (443) добавляется сюда же, когда появится домен/сертификат.

upstream shtativ_app {
    server app:3000;
}

server {
    listen 80 default_server;
    server_name _;

    # загрузка картинок в пины
    client_max_body_size 32m;

    # /api/auto генерирует пачку постов (RSS + AI) и может работать несколько минут
    proxy_connect_timeout 60s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # хешированная статика Next.js: путь меняется вместе с содержимым, кэш смело на год
    location /_next/static/ {
        proxy_pass http://shtativ_app;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://shtativ_app;
    }
}
